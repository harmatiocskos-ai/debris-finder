name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Gradle
        run: |
          VER=$(curl -s https://services.gradle.org/versions/current | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "Using Gradle $VER"
          curl -fL "https://services.gradle.org/distributions/gradle-${VER}-bin.zip" -o gradle.zip
          unzip -q gradle.zip
          echo "$(pwd)/gradle-${VER}/bin" >> $GITHUB_PATH

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ancient-debris-finder
          path: build/libs/*.jar
