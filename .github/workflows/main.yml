name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Gradle 9.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.2-bin.zip
          unzip -q gradle-9.2-bin.zip
          echo "$(pwd)/gradle-9.2/bin" >> $GITHUB_PATH
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ancient-debris-finder
          path: build/libs/*.jar
